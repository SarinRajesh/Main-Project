<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        {{ styles|safe }}
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ title }}</h1>
        <div class="generated-date">Generated on: {{ generated_date }}</div>
    </div>

    <table>
        <thead>
            <tr>
                {% if is_user_table %}
                    {% for header in headers %}
                        <th class="{{ header.class }}">{{ header.name }}</th>
                    {% endfor %}
                {% else %}
                    {% for header in headers %}
                        <th>{{ header }}</th>
                    {% endfor %}
                {% endif %}
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
                <tr>
                    {% for value in item %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
